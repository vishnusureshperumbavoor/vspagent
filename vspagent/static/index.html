<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSP | Saturday Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 1rem;
        }

        .search-section {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        #fetch-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #fetch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        #fetch-btn:active {
            transform: translateY(0);
        }

        #fetch-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .events-list {
            display: grid;
            gap: 1.5rem;
        }

        .event-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease-out both;
        }

        .event-card:hover {
            transform: scale(1.02);
            border-color: rgba(129, 140, 248, 0.5);
        }

        .event-card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .event-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .event-link {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            color: #818cf8;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .event-link:hover {
            background: rgba(129, 140, 248, 0.1);
        }

        .no-events {
            text-align: center;
            color: var(--text-dim);
            margin-top: 3rem;
            display: none;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Skeleton Loader */
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 10px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Saturday Planner</h1>
            <p class="subtitle">Bangalore Event Discovery by VSP Agent</p>
        </header>

        <div class="search-section">
            <button id="fetch-btn">
                <span class="loader" id="loader"></span>
                <span id="btn-text">Find Saturday Events</span>
            </button>
        </div>

        <div id="events-container" class="events-list">
            <!-- Events will appear here -->
        </div>

        <div id="no-events" class="no-events">
            No Saturday events found right now. Try again later!
        </div>
    </div>

    <script>
        const fetchBtn = document.getElementById('fetch-btn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btn-text');
        const container = document.getElementById('events-container');
        const noEventsMsg = document.getElementById('no-events');

        fetchBtn.addEventListener('click', async () => {
            // State: Loading
            fetchBtn.disabled = true;
            fetchBtn.classList.add('loading');
            loader.style.display = 'block';
            btnText.innerText = 'Searching Bengaluru...';
            container.innerHTML = '';
            noEventsMsg.style.display = 'none';

            try {
                const response = await fetch('/api/events');
                const data = await response.json();
                const events = data.events || [];

                if (events.length === 0) {
                    noEventsMsg.style.display = 'block';
                } else {
                    events.forEach((event, index) => {
                        const card = document.createElement('div');
                        card.className = 'event-card';
                        card.style.animationDelay = `${index * 0.1}s`;
                        
                        card.innerHTML = `
                            <h3>${event.title}</h3>
                            <div class="event-info">
                                📅 <span>${event.date}</span>
                            </div>
                            <a href="${event.url}" target="_blank" class="event-link">View Details</a>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to fetch events. Is the server running?');
            } finally {
                // State: Reset
                fetchBtn.disabled = false;
                fetchBtn.classList.remove('loading');
                loader.style.display = 'none';
                btnText.innerText = 'Find Saturday Events';
            }
        });
    </script>
</body>
</html>
