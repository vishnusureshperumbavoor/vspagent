[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vspagent"
version = "4.0.0"
description = "Terminal coding agent powered by OpenAI-compatible LLM APIs."
readme = "README.md"
authors = [{ name = "Vishnu Suresh Perumbavoor" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "keyring>=24.0.0",
    "platformdirs>=4.0.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vspagent = "vspagent.cli:main"
vsp = "vspagent.cli:main"

[project.urls]
GitHub = "https://github.com/vishnusureshperumbavoor/vspagent"
Issues = "https://github.com/vishnusureshperumbavoor/vspagent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vspagent*"]
