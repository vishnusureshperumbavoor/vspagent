[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vspagent"
version = "3.0.0"
description = "Universal Google Colab MCP Agent Orchestrator & Cloud GPU SDK."
readme = "README.md"
authors = [{ name = "Vishnu Suresh Perumbavoor" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "pydantic>=1.10.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
flask = ["flask>=2.0.0"]
all = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "flask>=2.0.0"]

[project.scripts]
vspagent = "vspagent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vspagent*"]
