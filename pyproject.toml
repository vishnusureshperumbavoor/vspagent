[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vspagent"
version = "3.0.2"
description = "Universal Google Colab MCP Agent Orchestrator & Cloud GPU SDK."
readme = "README.md"
authors = [{ name = "Vishnu Suresh Perumbavoor" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "pydantic>=1.10.0",
    "rich>=12.0.0",
]

[project.scripts]
vspagent = "vspagent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vspagent*"]
